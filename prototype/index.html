<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Potion Shop — UI/UX prototype</title>
<style>
/* ===================== design tokens ===================== */
:root{
  /* dusk scene palette */
  --scene-deep:#241D3D; --scene-wall:#3B3052; --scene-wall2:#453A63;
  --scene-floor:#2E2547; --scene-floor2:#362B54;
  --glow-warm:#FFC98F; --gold:#F5C542; --potion:#3FD9A8; --potion-hi:#62F0C0;
  /* parchment UI palette (shopkeeper's ledger) */
  --parchment:#F7E9C8; --parchment2:#EFDDB4; --ink:#3A2A1A; --ink-soft:#6B4A2F;
  --cta:#F06A8A; --cta-dark:#D14F70; --teal:#35B5A8; --teal-dark:#2A9186;
  --lav:#C9A8E0; --blush:#F2A0B5;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --shadow:0 4px 14px rgba(20,12,40,.45);
  --spring:cubic-bezier(.34,1.56,.64,1); /* overshoot spring */
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:#120E22;display:flex;justify-content:center;
  font-family:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
  color:var(--ink);
}
/* ===================== app frame ===================== */
#frame{position:relative;width:min(480px,100vw);height:100dvh;overflow:hidden;background:var(--scene-deep)}
#scene{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(10,6,24,.55) 100%);}
/* ===================== HUD pills ===================== */
#hud{position:absolute;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 12px 0;z-index:10;
  display:flex;flex-direction:column;gap:8px;animation:drop .7s var(--spring) both}
#shopTag{display:flex;align-items:center;gap:8px;color:var(--parchment);font-weight:800;font-size:15px;
  text-shadow:0 2px 6px rgba(0,0,0,.6)}
#shopTag small{font-weight:600;font-size:11px;opacity:.7}
#muteBtn{margin-left:auto;border:1px solid rgba(247,233,200,.35);background:rgba(30,22,55,.55);color:var(--parchment);
  border-radius:10px;font-size:14px;padding:4px 9px;cursor:pointer;backdrop-filter:blur(4px)}
#pills{display:flex;gap:7px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:5px;background:rgba(247,233,200,.92);color:var(--ink);
  border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;box-shadow:var(--shadow);
  border:1px solid rgba(255,255,255,.5);animation:pop .5s var(--spring) both}
.pill:nth-child(2){animation-delay:.05s}.pill:nth-child(3){animation-delay:.1s}.pill:nth-child(4){animation-delay:.15s}
.pill small{font-weight:600;opacity:.55;font-size:10px}
.pill.day{background:rgba(59,48,82,.92);color:var(--parchment);border-color:rgba(197,168,224,.4)}
.dayring{width:34px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.dayring i{display:block;height:100%;width:72%;border-radius:3px;background:linear-gradient(90deg,var(--lav),var(--gold))}
/* ===================== order bubble ===================== */
#bubble{position:absolute;left:50%;top:41%;transform:translate(-50%,-100%);z-index:8;display:flex;align-items:center;gap:8px;
  background:var(--parchment);border:2px solid var(--gold);border-radius:var(--r-md);padding:7px 11px;
  box-shadow:var(--shadow);cursor:pointer;animation:bubbleIn .6s var(--spring) .4s both}
#bubble::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);
  border:7px solid transparent;border-top-color:var(--gold);border-bottom:0}
.pring{position:relative;width:30px;height:30px;flex:none;display:grid;place-items:center;font-size:15px}
.pring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.pring .track{stroke:rgba(58,42,26,.15)}
.pring .drain{stroke:var(--teal);stroke-linecap:round;transition:stroke .3s}
.btext{font-size:12.5px;font-weight:700;font-style:italic;color:var(--ink-soft);max-width:170px;line-height:1.25}
/* ===================== mode dock ===================== */
#dock{position:absolute;left:0;right:0;bottom:37%;z-index:9;display:flex;justify-content:center;gap:8px;
  animation:rise .7s var(--spring) .2s both}
.dockBtn{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;padding:8px 10px 7px;
  border-radius:var(--r-md);border:1px solid rgba(247,233,200,.3);background:rgba(30,22,55,.62);color:var(--parchment);
  font-size:10.5px;font-weight:700;cursor:pointer;backdrop-filter:blur(5px);transition:transform .18s var(--spring),background .2s}
.dockBtn .ic{font-size:19px}
.dockBtn.on{background:var(--parchment);color:var(--ink);border-color:var(--parchment);transform:translateY(-4px)}
.dockBtn:active{transform:scale(.9)}
/* ===================== bottom sheet ===================== */
#sheet{position:absolute;left:0;right:0;bottom:0;height:36%;z-index:10;
  background:linear-gradient(180deg,var(--parchment),var(--parchment2));
  border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:0 -6px 24px rgba(10,6,24,.5);
  padding:8px 14px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px;
  animation:sheetUp .7s var(--spring) .1s both}
#handle{width:44px;height:5px;border-radius:3px;background:rgba(58,42,26,.28);margin:0 auto;flex:none}
#orderCard{display:flex;align-items:center;gap:10px;background:rgba(255,253,247,.75);
  border:1px solid rgba(58,42,26,.15);border-radius:var(--r-md);padding:9px 11px}
#orderCard .face{width:38px;height:38px;border-radius:11px;background:linear-gradient(160deg,#7B5CD6,#4C3A8C);
  display:grid;place-items:center;font-size:20px;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
#orderCard .who{font-size:13px;font-weight:800}
#orderCard .ail{font-size:12px;color:var(--ink-soft);font-style:italic;line-height:1.25}
#orderCard .hint{font-size:11px;color:var(--teal-dark);font-weight:700;margin-top:1px}
/* ingredients */
#ing{display:flex;gap:7px;overflow-x:auto;padding:2px;scrollbar-width:none}
#ing::-webkit-scrollbar{display:none}
.ing{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;padding:8px 6px;
  border-radius:var(--r-md);border:2px solid rgba(58,42,26,.15);background:rgba(255,253,247,.7);
  cursor:pointer;transition:transform .18s var(--spring),border-color .15s,background .15s}
.ing .ic{font-size:21px}
.ing .nm{font-size:10px;font-weight:700;color:var(--ink-soft)}
.ing .stock{font-size:9px;opacity:.55;font-weight:600}
.ing.on{border-color:var(--gold);background:#FFF6DD;transform:translateY(-3px);box-shadow:0 4px 10px rgba(245,197,66,.35)}
.ing:active{transform:scale(.92)}
/* brew / serve */
#actions{display:flex;gap:9px;flex:none}
.bigbtn{position:relative;flex:1;border:0;border-radius:var(--r-md);padding:13px 0;font-size:16px;font-weight:900;
  letter-spacing:.5px;cursor:pointer;color:#fff;overflow:hidden;
  transition:transform .15s var(--spring),filter .15s}
.bigbtn:active{transform:scale(.95)}
#brew{background:linear-gradient(180deg,var(--teal),var(--teal-dark));box-shadow:0 4px 0 #1F746B,var(--shadow)}
#serve{background:linear-gradient(180deg,var(--cta),var(--cta-dark));box-shadow:0 4px 0 #A63A55,var(--shadow)}
.bigbtn:disabled{filter:grayscale(.6) brightness(.85);cursor:default;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#brewFill{position:absolute;inset:0;background:rgba(255,255,255,.28);width:0%;pointer-events:none}
.bigbtn span{position:relative}
/* ===================== toast & fx ===================== */
#toast{position:absolute;top:16%;left:50%;transform:translate(-50%,-16px);z-index:30;opacity:0;
  background:var(--ink);color:var(--parchment);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:700;
  box-shadow:var(--shadow);transition:all .35s var(--spring);pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.coinfx{position:absolute;z-index:25;font-weight:900;font-size:15px;color:var(--gold);
  text-shadow:0 2px 0 rgba(0,0,0,.4);pointer-events:none;animation:coinUp 1.1s ease-out forwards}
/* ===================== animations ===================== */
@keyframes drop{from{transform:translateY(-24px);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bubbleIn{from{transform:translate(-50%,-80%) scale(.3);opacity:0}to{transform:translate(-50%,-100%) scale(1);opacity:1}}
@keyframes sheetUp{from{transform:translateY(60%);opacity:0}to{transform:none;opacity:1}}
@keyframes coinUp{from{transform:translateY(0);opacity:1}to{transform:translateY(-70px);opacity:0}}
@keyframes bump{40%{transform:scale(1.22)}}
.bump{animation:bump .4s var(--spring)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="frame">
  <canvas id="scene"></canvas>
  <div id="vignette"></div>

  <header id="hud">
    <div id="shopTag">⚗️ Pip's Potions <small>UI prototype · dusk</small>
      <button id="muteBtn">🔊</button>
    </div>
    <div id="pills">
      <div class="pill">🪙 <b id="coins">175</b></div>
      <div class="pill">⭐ <b>3.0</b> <small>guild</small></div>
      <div class="pill">✨ <b>17</b> <small>charm</small></div>
      <div class="pill day">🌙 Night 1 <div class="dayring"><i></i></div></div>
    </div>
  </header>

  <div id="bubble" title="Take order">
    <div class="pring"><svg viewBox="0 0 30 30">
        <circle class="track" cx="15" cy="15" r="13" fill="none" stroke-width="3"/>
        <circle class="drain" id="drain" cx="15" cy="15" r="13" fill="none" stroke-width="3"
          stroke-dasharray="81.7" stroke-dashoffset="0"/>
      </svg><span>⚔️</span></div>
    <div class="btext">"I fight slimes at dawn…"</div>
  </div>

  <nav id="dock">
    <button class="dockBtn on"><span class="ic">⚗️</span>Brew</button>
    <button class="dockBtn"><span class="ic">🪄</span>Decorate</button>
    <button class="dockBtn"><span class="ic">📜</span>Quests</button>
    <button class="dockBtn"><span class="ic">🏆</span>Guild</button>
  </nav>

  <section id="sheet">
    <div id="handle"></div>
    <div id="orderCard">
      <div class="face">🗡️</div>
      <div>
        <div class="who">Kael the Sellsword</div>
        <div class="ail">"Got a slime contract at dawn — need something that burns goo."</div>
        <div class="hint" id="hintLine">…brew to discover the remedy</div>
      </div>
    </div>
    <div id="ing"></div>
    <div id="actions">
      <button class="bigbtn" id="brew"><div id="brewFill"></div><span>⚗️ BREW</span></button>
      <button class="bigbtn" id="serve" disabled><span>🧪 SERVE</span></button>
    </div>
  </section>

  <div id="toast"></div>
</div>

<script>
/* ============================================================
   PIXEL-ART SCENE — procedural potion shop interior at dusk
   ============================================================ */
const cv = document.getElementById('scene'), cx = cv.getContext('2d');
const frame = document.getElementById('frame');
const PIX = 4;                       // css px per logical pixel
let W, H;

function size(){
  const r = frame.getBoundingClientRect();
  W = Math.round(r.width / PIX); H = Math.round(r.height / PIX);
  cv.width = W; cv.height = H;
}
addEventListener('resize', size); size();

const C = { wall:'#3B3052', wall2:'#453A63', floor:'#2E2547', floor2:'#362B54',
  base:'#241D3D', wood:'#6B4A2F', woodD:'#4E3320', pot:'#151022', potRim:'#0E0A1C',
  potion:'#3FD9A8', potionHi:'#62F0C0', fire1:'#FF9E4F', fire2:'#FFD93D',
  candle:'#FFE3A3', moon:'#E8F4FF', rug:'#8C3F63', rugIn:'#B5527C', rugTrim:'#F5C542',
  cloak:'#5A3FA8', cloakD:'#432D80', skin:'#F2C9A0', steel:'#B8C4D8',
  shelf:'#7A5433', cat:'#1A1428', catHi:'#2A2140' };
const JARS = ['#F06A8A','#35B5A8','#C9A8E0','#F5C542','#FF8C42','#5BC8FF'];
const px = (x,y,w,h,c)=>{ cx.fillStyle=c; cx.fillRect(x|0,y|0,w|0,h|0); };
const fx = f=>W*f, fy = f=>H*f;

/* animated bits */
let bubbles=[], sparks=[], t0=performance.now();
for(let i=0;i<14;i++) sparks.push({x:Math.random(),y:.25+Math.random()*.6,s:.15+Math.random()*.5,ph:Math.random()*7});

function draw(t){
  t=(t-t0)/1000;
  /* ---- wall ---- */
  px(0,0,W,fy(.30),C.wall);
  px(0,fy(.28),W,fy(.30)-fy(.28),C.wall2);          // dado rail
  /* window: moonlit, right side */
  const wx=fx(.70),wy=fy(.05),ww=fx(.22),wh=fy(.13);
  px(wx-2,wy-2,ww+4,wh+4,C.woodD);
  px(wx,wy,ww,wh,'#1B2A55');                          // night sky
  px(wx+ww*.62,wy+wh*.18,6,6,C.moon);                 // moon
  px(wx+ww*.62+1,wy+wh*.18+1,4,4,'#F4FBFF');
  px(wx+2,wy+2,2,2,'#9DB8E8'); px(wx+ww*.3,wy+wh*.5,2,2,'#9DB8E8'); // stars
  px(wx+ww/2-1,wy,2,wh,C.woodD); px(wx,wy+wh/2-1,ww,2,C.woodD);     // frame
  /* shelf + jars, left */
  const sx=fx(.07),sy=fy(.13),sw=fx(.36);
  px(sx,sy+fy(.035),sw,fy(.012),C.shelf);
  JARS.forEach((j,i)=>{ const jx=sx+4+i*(sw-8)/5;
    px(jx,sy,7,fy(.032),'#D8C8E8');                    // glass
    px(jx+1,sy+fy(.012),5,fy(.02),j);                  // liquid
    px(jx+2,sy-3,3,3,'#8A6A45');                       // cork
  });
  /* hanging herbs */
  [.48,.55,.62].forEach((hx,i)=>{ px(fx(hx),fy(.05),1,fy(.04),'#4E3320');
    px(fx(hx)-2,fy(.09),5,fy(.05),i%2?'#3FAE6A':'#2E8A52'); });
  /* tiny portrait */
  px(fx(.42),fy(.055),10,12,'#F5C542'); px(fx(.42)+1,fy(.055)+1,8,10,'#2E1C12');
  /* door, left edge — warm light inside */
  const dx=0,dy=fy(.36),dw=fx(.075),dh=fy(.24);
  px(dx,dy,dw,dh,'#1A1226');
  const flick=.75+Math.sin(t*7)*.25;
  cx.globalAlpha=.5*flick; px(dx+dw-3,dy,3,dh,'#FFC98F'); cx.globalAlpha=1;
  /* ---- floor: checker tiles ---- */
  const ts=Math.max(6,Math.round(W/14));
  for(let r=0,y=fy(.30);y<H;y+=ts,r++)
    for(let x=0;x<W;x+=ts) px(x,y,ts,ts,((x/ts|0)+r)%2?C.floor:C.floor2);
  /* rug */
  const rx=fx(.28),ry=fy(.55),rw=fx(.46),rh=fy(.17);
  px(rx,ry,rw,rh,C.rugTrim); px(rx+2,ry+2,rw-4,rh-4,C.rug);
  px(rx+4,ry+4,rw-8,rh-8,C.rugIn);
  /* counter, right */
  const cxn=fx(.70),cy=fy(.50),cw=fx(.29),ch=fy(.14);
  px(cxn,cy,cw,ch,C.wood); px(cxn,cy,cw,fy(.018),C.shelf);
  px(cxn+3,cy+fy(.04),cw-6,fy(.02),C.woodD);           // drawer line
  /* candle on counter */
  const cdx=fx(.80),cdy=cy-fy(.045);
  cx.globalAlpha=.35+flick*.25; px(cdx-5,cdy-5,16,16,'#FFC98F'); cx.globalAlpha=1; // halo
  px(cdx,cdy,6,fy(.04),'#FFF3DC'); px(cdx+2,cdy-4,2,4,flick>.8?C.fire2:C.fire1);
  /* cauldron, left-center */
  const px0=fx(.14),py0=fy(.52),pw=fx(.21),ph=fy(.13);
  /* fire underneath */
  px(px0+pw*.2,py0+ph,pw*.6,fy(.025),C.woodD);
  for(let i=0;i<3;i++){ const fh=3+((t*8+i*2)%6);
    px(px0+pw*(.3+i*.18),py0+ph-fh,pw*.12,fh,i%2?C.fire2:C.fire1); }
  cx.globalAlpha=.3; px(px0-4,py0-4,pw+8,ph+8,'#3FD9A8'); cx.globalAlpha=1;  // glow
  /* pot body (rounded via row widths) */
  px(px0+2,py0,pw-4,ph,C.pot);
  px(px0,py0+3,pw,ph-6,C.pot);
  px(px0-2,py0+6,pw+4,ph*.5,C.pot);
  px(px0-2,py0-2,pw+4,4,C.potRim);                     // rim
  px(px0+3,py0-1,pw-6,3,C.potion);                     // liquid surface
  px(px0+3,py0-1,pw-6,1,C.potionHi);
  /* legs + handles */
  px(px0+2,py0+ph-2,3,4,C.potRim); px(px0+pw-5,py0+ph-2,3,4,C.potRim);
  /* bubbles rising from liquid */
  if(Math.random()<.25) bubbles.push({x:px0+4+Math.random()*(pw-8),y:py0,v:.3+Math.random()*.4});
  bubbles=bubbles.filter(b=>{ b.y-=b.v; if(b.y<py0-14)return false;
    px(b.x,b.y,1,2,'rgba(98,240,192,.8)'); return true; });
  /* customer — hooded adventurer, center on rug */
  const ux=fx(.46),uy=fy(.50);
  px(ux+2,uy+fy(.09),10,fy(.085),C.cloakD);            // cloak base
  px(ux+3,uy+fy(.03),8,fy(.07),C.cloak);               // cloak
  px(ux+4,uy,6,5,C.cloak);                             // hood
  px(ux+5,uy+2,4,3,C.skin);                            // face shadow
  px(ux+6,uy+2,1,1,'#2E1C12');                         // eye
  px(ux+1,uy+fy(.03),2,fy(.05),C.steel);               // sword hilt on back
  px(ux+1,uy,1,3,'#8A6A45');
  /* cat familiar, curled on rug right */
  const kx=fx(.62),ky=fy(.66);
  px(kx,ky,9,4,C.cat); px(kx+1,ky-1,3,2,C.cat);        // head
  px(kx+1,ky-3,1,2,C.catHi); px(kx+3,ky-3,1,2,C.catHi);// ears
  px(kx+8,ky-1,2,2,C.catHi);                           // tail tip
  if(((t*.5)%1)<.5) px(kx+12,ky-6-((t*3)%3),2,2,'#C9A8E0'); // Z z z
  /* sparkles drifting up */
  sparks.forEach(s=>{ s.y-=s.s/900; if(s.y<.2)s.y=.85;
    const tw=Math.sin(t*3+s.ph)>0;
    cx.globalAlpha=tw?.9:.3; px(fx(s.x),fy(s.y),1,2,'#FFE9A8'); cx.globalAlpha=1; });
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ============================================================
   UI — tiny interactive demo (ingredients → brew → serve)
   ============================================================ */
const INGS=[["🔥","emberroot",30],["🌙","moonwater",30],["🍄","ghostcap",30],
            ["✨","stardew",30],["❄️","frostfern",30],["🩸","drakesblood",30]];
const CORRECT=new Set(["emberroot","frostfern"]);
const ing=document.getElementById('ing');
INGS.forEach(([ic,nm,st])=>{ const d=document.createElement('div');
  d.className='ing'+(CORRECT.has(nm)?' on':'');
  d.innerHTML=`<span class="ic">${ic}</span><span class="nm">${nm}</span><span class="stock">×${st}</span>`;
  d.onclick=()=>d.classList.toggle('on'); ing.appendChild(d); });

const $=id=>document.getElementById(id);
const toast=(m)=>{ const t=$('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('show'),2200); };

/* patience ring drains (demo: 45s loop) */
const drain=$('drain'), LEN=81.7; let pt=0;
setInterval(()=>{ pt=(pt+0.25)%45; const p=1-pt/45;
  drain.style.strokeDashoffset=LEN*(1-p);
  drain.style.stroke=p>.5?'var(--teal)':p>.25?'#F0A03C':'#E05252';
  if(p<=0) toast('💨 Kael lost patience…');
},250);

$('brew').onclick=()=>{
  const sel=[...ing.querySelectorAll('.ing.on .nm')].map(e=>e.textContent);
  if(!sel.length){ toast('Pick 1–3 ingredients first'); return; }
  const b=$('brew'); b.disabled=true; const f=$('brewFill');
  let p=0; const iv=setInterval(()=>{ p+=2.5; f.style.width=p+'%';
    if(p>=100){ clearInterval(iv); b.disabled=false; f.style.width='0%';
      const right=CORRECT.size===sel.length&&sel.every(s=>CORRECT.has(s));
      if(right){ $('serve').disabled=false;
        $('hintLine').textContent='✨ Slimebane Draught — emberroot · frostfern';
        toast('✨ Discovered: Slimebane Draught!'); }
      else toast('☁️ Unstable concoction… (+2 🪙, Kael winces)'); }
  },60); };

$('serve').onclick=()=>{ $('serve').disabled=true;
  for(let i=0;i<5;i++){ const c=document.createElement('div');
    c.className='coinfx'; c.textContent='+'+(i?3:15)+'🪙';
    c.style.left=(38+Math.random()*24)+'%'; c.style.bottom=(30+Math.random()*8)+'%';
    c.style.animationDelay=(i*.09)+'s'; frame.appendChild(c);
    setTimeout(()=>c.remove(),1400); }
  $('coins').textContent=175+18; const pill=$('coins').parentElement;
  pill.classList.remove('bump'); void pill.offsetWidth; pill.classList.add('bump');
  toast('🗡️ Served Kael! +18 🪙 (tip 3)');
  setTimeout(()=>{$('serve').disabled=false;$('coins').textContent=175;
    $('hintLine').textContent='…brew to discover the remedy';},2600); };

document.querySelectorAll('.dockBtn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.dockBtn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  if(b.textContent.trim()!=='Brew') toast('Sheet would swap: '+b.textContent.trim());
});
$('muteBtn').onclick=e=>{e.target.textContent=e.target.textContent==='🔊'?'🔇':'🔊';};
$('bubble').onclick=()=>toast('Order card is docked in the sheet below ↑');
</script>
