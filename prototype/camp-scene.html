<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Trailbound — campsite prototype</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0d0b18;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif}
  #cv{position:fixed;inset:0;display:block}
  .pills{position:fixed;top:14px;left:0;right:0;display:flex;gap:8px;justify-content:center;z-index:5;pointer-events:none}
  .pill{display:flex;align-items:center;gap:8px;background:rgba(18,14,32,.92);border-radius:20px;
        padding:9px 16px;color:#fff;font-weight:600;font-size:15px;border:1px solid rgba(255,255,255,.08)}
  .pill .dot{width:18px;height:18px;border-radius:50%;display:inline-block}
  .night b{color:#8fd8ff;font-weight:600}
  #bubble{position:fixed;z-index:6;width:250px;background:#f6eacc;border:3px solid #1e1430;border-radius:16px;
          padding:10px 14px 12px;cursor:pointer;transform:translate(-50%,-100%);display:none;
          box-shadow:0 6px 0 rgba(0,0,0,.35)}
  #bubble::after{content:'';position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);
    border:8px solid transparent;border-top:14px solid #f6eacc;filter:drop-shadow(0 3px 0 #1e1430)}
  #bubble .who{font-size:11px;letter-spacing:.08em;font-weight:800;color:#5a4470}
  #bubble .ail{font-size:15px;color:#37294a;font-weight:600;margin-top:2px}
  #bubble .ring{position:absolute;top:8px;right:8px;width:26px;height:26px}
  #bubble .hint{font-size:11px;color:#8a76a0;margin-top:4px}
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:7;background:rgba(22,16,40,.96);
    border-top:2px solid rgba(208,176,124,.5);border-radius:26px 26px 0 0;padding:16px 18px 22px;
    color:#fff;backdrop-filter:blur(8px)}
  #sheet h2{text-align:center;font-size:19px;color:#ffedd0}
  #sheet .sub{text-align:center;font-size:13px;color:#b8a6cf;margin:4px 0 12px}
  #chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
  .chip{background:#2a2140;border:2px solid #4a3f6e;border-radius:18px;padding:9px 14px;color:#cdc3e0;
        font-size:14px;font-weight:600;cursor:pointer;user-select:none;transition:transform .1s,background .15s}
  .chip.sel{background:#3a6249;border-color:#9fe8c0;color:#d6ffe4}
  .chip:active{transform:scale(.93)}
  #actions{display:flex;gap:10px}
  .btn{flex:1;border:none;border-radius:20px;padding:17px 0;font-size:19px;font-weight:800;cursor:pointer;
       letter-spacing:.04em;transition:transform .08s}
  .btn:active{transform:scale(.95)}
  #brew{background:#2cc4a8;color:#08231e;position:relative;overflow:hidden}
  #brew .fill{position:absolute;inset:0;background:rgba(255,255,255,.35);width:0%}
  #brew span{position:relative;z-index:1}
  #serve{background:#3a3054;color:#9a8cc0}
  #serve.ready{background:#e8a33d;color:#2c1a05}
  .btn:disabled{opacity:.5;cursor:default}
  /* fishing tension bar */
  #fisher{display:none;margin-bottom:14px}
  #track{height:26px;background:#1a1430;border-radius:13px;position:relative;overflow:hidden;
    border:1px solid #4a3f6e}
  #zone{position:absolute;top:0;bottom:0;background:rgba(44,196,168,.35);border-radius:6px}
  #needle{position:absolute;top:-3px;bottom:-3px;width:8px;background:#ffd050;border-radius:4px;
    box-shadow:0 0 10px #ffd050}
  #fhint{text-align:center;font-size:12px;color:#9fd8c8;margin-top:8px}
  #toast{position:fixed;top:100px;left:50%;transform:translateX(-50%);z-index:9;background:#2a2140;
    border:1px solid #6a5a9e;padding:10px 18px;border-radius:14px;color:#ffe9b8;font-weight:600;
    opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
</style></head><body>
<canvas id="cv"></canvas>
<div class="pills">
  <div class="pill"><span class="dot" style="background:#ffc844"></span><span id="coins">340</span></div>
  <div class="pill"><span class="dot" style="background:#7ae898"></span>Charm 8</div>
  <div class="pill night"><span>🌲</span><b>Forest · Day 1</b></div>
</div>
<div id="bubble">
  <svg class="ring" viewBox="0 0 26 26"><circle cx="13" cy="13" r="10" fill="none" stroke="#e0d4f0" stroke-width="4"/>
    <circle id="pring" cx="13" cy="13" r="10" fill="none" stroke="#2cc4a8" stroke-width="4"
      stroke-dasharray="63" stroke-dashoffset="0" transform="rotate(-90 13 13)"/></svg>
  <div class="who" id="bwho">CAMPER</div>
  <div class="ail" id="bail">"got any firewood?"</div>
  <div class="hint">tap to help out</div>
</div>
<div id="sheet">
  <h2 id="shtitle">Pinewood Camp</h2>
  <div class="sub" id="shsub">Tap the river to fish · tap a visitor's bubble to help them</div>
  <div id="fisher"><div id="track"><div id="zone"></div><div id="needle"></div></div>
    <div id="fhint">hold to reel — keep the marker in the green!</div></div>
  <div id="chips"></div>
  <div id="actions">
    <button class="btn" id="brew" disabled><span class="fill"></span><span>COOK</span></button>
    <button class="btn" id="serve" disabled>GIVE</button>
  </div>
</div>
<div id="toast"></div>
<script>
/* ================= world / iso grid ================= */
/* Kenney tile: 132x99, top-face center at (66,34), grid step (66,33) */
const VW=1120,VH=1080;
const GX=9,GYR=7,OX=VW/2,OY=190;
const T=(i,j)=>({x:OX+(i-j)*66,y:OY+(i+j)*33});      // surface center of cell
const GEN='assets/gen/',CAMP='assets/camp/',KN='assets/kenney_landscape/PNG/';
const IMGS={};
function ld(k,src){const i=new Image();i.src=src;IMGS[k]=i;return i}
ld('grass',KN+'landscapeTiles_075.png');
ld('water',KN+'landscapeTiles_043.png');
ld('dirt', KN+'landscapeTiles_020.png');
ld('river',KN+'landscapeTiles_032.png');   // grass-banked river piece
ld('shop', GEN+'shop_0.png');
ld('tree', GEN+'p_tree_0.png');
ld('witch',GEN+'witch_1.png');
ld('slime',GEN+'p_slime_0.png');
ld('k0',GEN+'knight_0.png');ld('k1',GEN+'knight_1.png');
ld('k2',GEN+'knight_2.png');ld('k3',GEN+'knight_3.png');
ld('tent',CAMP+'tent.png');ld('firering',CAMP+'firering.png');
ld('tripod',CAMP+'tripod.png');ld('tarp',CAMP+'tarp.png');
ld('torch',CAMP+'crate.png');ld('logs',CAMP+'logs.png');ld('stump',CAMP+'stump.png');
const fire=new Image();fire.src='assets/campfire.png';   // 4 frames 16x16

/* ================= canvas ================= */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let SC=1,Ox=0,Oy=0;
function resize(){
  cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;
  cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';
  SC=Math.min(innerWidth/VW,(innerHeight)/VH)*devicePixelRatio;
  Ox=(innerWidth*devicePixelRatio-VW*SC)/2;Oy=6*devicePixelRatio;
}
addEventListener('resize',resize);resize();
function toScreen(wx,wy){return{x:(Ox+wx*SC)/devicePixelRatio,y:(Oy+wy*SC)/devicePixelRatio}}
function toWorld(sx,sy){return{x:(sx*devicePixelRatio-Ox)/SC,y:(sy*devicePixelRatio-Oy)/SC}}

/* ================= terrain map ================= */
/* 9x7 field; river strip along right (i>=7); dirt path winding */
const DIRT=new Set(['2,6','2,5','3,5','3,4','4,4','4,3']);   // path cells
const WATER=new Set(['7,0','8,0','7,1','8,1','7,2','8,2','8,3','7,4','8,4','7,5','8,5','7,6','8,6']);
const staticCv=document.createElement('canvas');staticCv.width=VW;staticCv.height=VH;
const sx=staticCv.getContext('2d');
function buildStatic(){
  for(let i=0;i<GX;i++)for(let j=0;j<GYR;j++){
    const p=T(i,j);const key=WATER.has(i+','+j)?'water':DIRT.has(i+','+j)?'dirt':'grass';
    const im=IMGS[key];if(!im.complete||!im.naturalWidth){setTimeout(buildStatic,60);return}
    sx.drawImage(im,p.x-66,p.y-34);
  }
  // darken river water slightly for dusk mood
  for(const c of WATER){const[i,j]=c.split(',').map(Number);const p=T(i,j);
    sx.fillStyle='rgba(30,50,110,.18)';sx.fillRect(p.x-66,p.y-34,132,99)}
}
buildStatic();

/* ================= draw helpers ================= */
function put(im,fx,fy,sc=1,flip=1,alpha=1,tilt=0){
  if(!im.complete||!im.naturalWidth)return;
  const w=im.naturalWidth*sc,h=im.naturalHeight*sc;
  ctx.save();ctx.translate(fx,fy);ctx.scale(flip,1);ctx.rotate(tilt);ctx.globalAlpha=alpha;
  ctx.drawImage(im,-w/2,-h,w,h);ctx.restore();
}
function shadow(fx,fy,r,a=.28){ctx.fillStyle=`rgba(10,8,20,${a})`;
  ctx.beginPath();ctx.ellipse(fx,fy,r,r*.32,0,0,7);ctx.fill()}
const parts=[];
function spawnP(x,y,vx,vy,life,size,col,grav=0){parts.push({x,y,vx,vy,life,size,col,grav,t:0})}
function stepParts(dt){for(const p of parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.grav*dt}
  for(let i=parts.length-1;i>=0;i--)if(parts[i].t>parts[i].life)parts.splice(i,1)}
function drawParts(){for(const p of parts){ctx.globalAlpha=1-p.t/p.life;ctx.fillStyle=p.col;
  ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1-p.t/p.life*.4),0,7);ctx.fill()}ctx.globalAlpha=1}

/* ================= props on surface cells ================= */
const FP=T(4,4);            // campfire cell
const PROPS=[
  [IMGS.shop, T(1,1),0.62],
  [IMGS.tent, T(2,3),0.30],
  [IMGS.tarp, T(5,3),0.30],
  [IMGS.tree, T(0,1),1.0],[IMGS.tree,T(1,6),1.1],[IMGS.tree,T(6,0),0.9],
  [IMGS.firering,FP,0.30],
  [IMGS.tripod,T(5,4),0.30],
  [IMGS.torch,T(3,5),0.5],[IMGS.torch,T(4,6),0.5],
  [IMGS.logs, T(3,3),0.5],[IMGS.stump,T(2,4),0.5],
];

/* ================= characters ================= */
const CHS=[];
const CAST=['k0','k1','k2','k3','slime'];
let castIdx=0;
const SPOTS=[T(3,4),T(5,5),T(4,5)];
const PIN=[T(2,6),T(2,5),T(3,5)];
const POUT=[T(4,6),T(6,6),T(8,6),T(9,6)];
const LINES=[
  {who:'JUN · HIKER',ail:'"trail took longer than I thought… got any hot cocoa?"',pay:60},
  {who:'MOSS',ail:'"my tent pole snapped. can I borrow a log?"',pay:45},
  {who:'DEE · BIKER',ail:'"my chain broke — know a fix?"',pay:75},
  {who:'PIP · KID',ail:'"i saw a BEAR. maybe. can i have marshmallows?"',pay:50},
  {who:'BLUB',ail:'"blub… blub blub!!" (it wants a fish)',pay:85},
];
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function spawnVisitor(){
  const key=CAST[castIdx++%CAST.length];
  const spot=SPOTS[CHS.length%SPOTS.length];
  const s=PIN[0];
  CHS.push({key,x:s.x,y:s.y,z:0,state:'walk',
    wp:[...PIN.slice(1),SPOTS[CHS.length%SPOTS.length]].map(p=>[p.x,p.y]),
    wi:0,t:0,bob:0,patience:1,happy:false,served:false,ail:pick(LINES)});
}
/* camp host (witch sprite = the camp keeper) by the fire */
const host={x:FP.x-70,y:FP.y+18,t:0};
/* pet slime by the river */
const pet={hx:T(7,4).x,hy:T(7,4).y,t:0};

/* ================= game state ================= */
let coins=340,selOrder=null,brewing=0,readyPot=null;
let fishing=null; // {phase:'cast'|'wait'|'tension',...}
const SUP=['Firewood','Marshmallows','Cocoa','Bandage','Rope'];
const chipsEl=document.getElementById('chips');let selChips=new Set();
for(const n of SUP){const c=document.createElement('div');c.className='chip';c.textContent=n;
  c.onclick=()=>{if(!selOrder)return;c.classList.toggle('sel');
    c.classList.contains('sel')?selChips.add(n):selChips.delete(n);
    brewBtn.disabled=!(selOrder&&selChips.size>=1)};
  chipsEl.appendChild(c)}
const bubbleEl=document.getElementById('bubble'),brewBtn=document.getElementById('brew'),
      serveBtn=document.getElementById('serve'),toastEl=document.getElementById('toast'),
      fisher=document.getElementById('fisher'),zone=document.getElementById('zone'),
      needle=document.getElementById('needle');
function toast(s){toastEl.textContent=s;toastEl.style.opacity=1;
  clearTimeout(toastEl._t);toastEl._t=setTimeout(()=>toastEl.style.opacity=0,1700)}
function setSheet(t,s){document.getElementById('shtitle').textContent=t;
  document.getElementById('shsub').textContent=s}
bubbleEl.onclick=()=>{const c=CHS.find(c=>c.state==='wait'&&!c.served);if(!c)return;
  selOrder=c;setSheet('Help '+c.ail.who.split(' ')[0],'Pick 1–2 supplies');
  brewBtn.disabled=selChips.size<1};
brewBtn.onclick=()=>{if(!selOrder||brewing>0)return;brewing=0.0001;
  serveBtn.disabled=true;serveBtn.classList.remove('ready')};
serveBtn.onclick=()=>{if(!readyPot||!selOrder)return;
  const c=selOrder;c.served=true;c.state='leave';c.wp=POUT.map(p=>[p.x,p.y]);c.wi=0;c.happy=true;
  coins+=c.ail.pay;document.getElementById('coins').textContent=coins;
  for(let i=0;i<14;i++)spawnP(c.x,c.y-70,(Math.random()-.5)*160,-Math.random()*220-60,.9,5,'#ffd050',500);
  toast('+'+c.ail.pay+' ✦ '+c.ail.who.split(' ')[0]+' is grateful!');
  selOrder=null;readyPot=null;serveBtn.disabled=true;serveBtn.classList.remove('ready');
  selChips.clear();document.querySelectorAll('.chip').forEach(e=>e.classList.remove('sel'));
  setSheet('Pinewood Camp','Tap the river to fish · tap a visitor\u2019s bubble to help them')};

/* ============ fishing ============ */
const riverC=T(8,3);
let holding=false;
addEventListener('pointerdown',e=>{holding=true});
addEventListener('pointerup',()=>holding=false);
cv.addEventListener('pointerdown',e=>{
  const p=toWorld(e.clientX,e.clientY);
  if(fishing)return;
  // tapped river area?
  if(p.x>T(7,0).x-20&&p.x>T(6,0).x&&p.y>T(7,0).y&&p.y<T(8,6).y+40){
    fishing={phase:'cast',t:0,bx:p.x,by:p.y};
    setSheet('Fishing','casting…');fisher.style.display='none';
  }
});
function fishStep(dt,NOW){
  if(!fishing)return;
  const f=fishing;f.t+=dt;
  if(f.phase==='cast'){f.bx+= (riverC.x-f.bx)*dt*4;f.by+=(riverC.y-f.by)*dt*4;
    if(f.t>.5){f.phase='wait';f.wait=1+Math.random()*2.5}}
  else if(f.phase==='wait'){
    if(Math.random()<.15)spawnP(f.bx,f.by-6,0,-8,.6,2.4,'#a8ecff');
    if(f.t>.5+f.wait){f.phase='strike';f.t=0;setSheet('Fishing','!!! — reel it in! (hold)')}
  }
  else if(f.phase==='strike'){
    fisher.style.display='block';
    // tension: marker driven by fish + holding pull
    f.n=f.n??50;f.v=f.v??0;
    f.v+=((holding?260:-160)+(Math.sin(T*7+f.t*3)*60))*dt;
    f.n=Math.max(0,Math.min(100,f.n+f.v*dt));
    zone.style.left='35%';zone.style.width='30%';
    needle.style.left=`calc(${f.n}% - 4px)`;
    if(f.n>35&&f.n<65){f.prog=(f.prog||0)+dt;
      if(Math.random()<.3)spawnP(f.bx,f.by-8,(Math.random()-.5)*30,-20,.7,2.6,'#d8f8ff');
      if(f.prog>2.2){const pay=30+((Math.random()*70)|0);
        coins+=pay;document.getElementById('coins').textContent=coins;
        for(let i=0;i<12;i++)spawnP(f.bx,f.by-10,(Math.random()-.5)*150,-Math.random()*200-50,.9,4.5,'#7ee8f0',480);
        toast('🐟 Caught a brook char! +'+pay);
        fishing=null;fisher.style.display='none';
        setSheet('Pinewood Camp','Tap the river to fish · tap a visitor\u2019s bubble to help them')}
    }else f.prog=Math.max(0,(f.prog||0)-dt*1.4);
    if(f.t>7){toast('it got away…');fishing=null;fisher.style.display='none';
      setSheet('Pinewood Camp','Tap the river to fish · tap a visitor\u2019s bubble to help them')}
  }
}

/* ================= main loop ================= */
let last=performance.now(),spawnT=1;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;const NOW=now/1000;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#0d0b18';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(SC,0,0,SC,Ox,Oy);
  // stars
  for(let i=0;i<70;i++){const x=(i*173)%VW,y=(i*97)%VH;
    ctx.globalAlpha=.25+.55*Math.abs(Math.sin(NOW*.9+i));
    ctx.fillStyle=['#fff0be','#beebff','#d2beff','#96ffd7'][i%4];
    ctx.fillRect(x,y,i%5?2:3,i%5?2:3)}
  ctx.globalAlpha=1;
  ctx.drawImage(staticCv,0,0);
  // water shimmer
  ctx.globalAlpha=.4+.25*Math.sin(NOW*1.7);ctx.fillStyle='#a8ecff';
  const rp=T(8,3);ctx.beginPath();ctx.ellipse(rp.x,rp.y-20,30,8,0,0,7);ctx.fill();ctx.globalAlpha=1;
  // bobber
  if(fishing){ctx.fillStyle='#e04848';
    ctx.beginPath();ctx.arc(fishing.bx,fishing.by-8-Math.sin(NOW*4)*2,5,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillRect(fishing.bx-2,fishing.by-15,4,5);
    if(fishing.phase==='strike'){ctx.fillStyle='#ffd050';ctx.font='bold 26px sans-serif';
      ctx.fillText('!',fishing.bx-6,fishing.by-30-Math.sin(NOW*8)*4)}}
  // fireflies + embers
  if(Math.random()<.05)spawnP(OX+(Math.random()-.5)*500,300+Math.random()*300,10-Math.random()*20,-8,4,2.4,'#ffe898');
  if(Math.random()<.5)spawnP(FP.x+(Math.random()-.5)*26,FP.y-24,(Math.random()-.5)*20,-50-Math.random()*40,1.4,3,'#ffb04a');
  if(Math.random()<.1)spawnP(FP.x,FP.y-40,(Math.random()-.5)*10,-30,2,6,'rgba(120,120,120,.35)');
  stepParts(dt);

  /* spawn visitors */
  if(CHS.filter(c=>!c.served).length<2){spawnT-=dt;if(spawnT<=0){spawnVisitor();spawnT=3}}

  /* character physics (same as animated demo) */
  host.t+=dt;
  const stir=brewing>0;
  const wBob=Math.sin(host.t*(stir?9:2.4))*(stir?4:2.5);
  const wTilt=stir?Math.sin(host.t*9)*.1:Math.sin(host.t*2.4)*.03;
  pet.t+=dt;
  const hop=Math.abs(Math.sin(pet.t*3.2));
  const sq=1-.28*Math.max(0,Math.cos(pet.t*6.4));
  let bubbleTarget=null;
  for(let i=CHS.length-1;i>=0;i--){
    const c=CHS[i];c.t+=dt;
    if(c.state==='walk'||c.state==='leave'){
      const wp=c.wp[c.wi];if(!wp){if(c.state==='leave'){CHS.splice(i,1);continue}
        c.state='wait';c.t=0;continue}
      const dx=wp[0]-c.x,dy=wp[1]-c.y,d=Math.hypot(dx,dy);
      if(d<4){c.wi++;continue}
      const sp=c.happy?160:100;
      c.x+=dx/d*sp*dt;c.y+=dy/d*sp*dt;
      c.z=Math.abs(Math.sin(c.t*11))*5;c.flip=dx<0?-1:1;
    }else if(c.state==='wait'){
      c.patience-=dt/60;c.z=Math.abs(Math.sin(c.t*2.2))*2;
      if(c.patience<=0){c.state='leave';c.wp=POUT.map(p=>[p.x,p.y]);c.wi=0;
        if(selOrder===c)selOrder=null;
        toast(c.ail.who.split(' ')[0]+' wandered off…')}
    }
    if(c.state==='wait'&&!c.served&&!bubbleTarget)bubbleTarget=c;
  }

  /* depth sort: props + characters by surface-y */
  const DRAW=[];
  for(const[im,p,sc]of PROPS)DRAW.push({fy:p.y,fn:()=>{
    shadow(p.x,p.y,Math.min(90,(im.naturalWidth||100)*sc*.34),.2);put(im,p.x,p.y,sc)}});
  // campfire animated sprite on the ring
  DRAW.push({fy:FP.y+2,fn:()=>{
    const fr=Math.floor(NOW*8)%4;
    if(fire.complete)sx2draw(fire,fr*16,0,16,16,FP.x-32,FP.y-52,64,64);
    // warm halo
    const g=ctx.createRadialGradient(FP.x,FP.y-20,4,FP.x,FP.y-20,90);
    g.addColorStop(0,'rgba(255,160,60,.30)');g.addColorStop(1,'rgba(255,160,60,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(FP.x,FP.y-20,90,0,7);ctx.fill()}});
  DRAW.push({fy:host.y,fn:()=>{shadow(host.x,host.y,28);
    put(IMGS.witch,host.x,host.y+Math.min(0,wBob*.3),1.25,1,1,wTilt)}});
  DRAW.push({fy:pet.hy,fn:()=>{shadow(pet.hx,pet.hy,18);
    ctx.save();ctx.translate(pet.hx,pet.hy-hop*20);ctx.scale(1,2-sq);
    ctx.translate(-pet.hx,-pet.hy+hop*20);put(IMGS.slime,pet.hx,pet.hy,1.1);ctx.restore()}});
  for(const c of CHS){DRAW.push({fy:c.y,fn:()=>{
    shadow(c.x,c.y,c.key==='slime'?16:24);
    ctx.save();ctx.translate(c.x,c.y-c.z);ctx.scale(c.flip||1,1);ctx.translate(-c.x,-c.y+c.z);
    put(IMGS[c.key],c.x,c.y,c.key==='slime'?1.05:1.25);ctx.restore()}})}
  DRAW.sort((a,b)=>a.fy-b.fy);
  for(const e of DRAW)e.fn();
  drawParts();

  function sx2draw(im,x,y,w,h,dx,dy,dw,dh){ctx.drawImage(im,x,y,w,h,dx,dy,dw,dh)}

  /* cooking progress */
  if(brewing>0){brewing+=dt/2.2;
    brewBtn.querySelector('.fill').style.width=Math.min(100,brewing*100)+'%';
    if(Math.random()<.5)spawnP(FP.x,FP.y-50,(Math.random()-.5)*30,-46,1,3.4,'#ffd8a0');
    if(brewing>=1){brewing=0;readyPot=true;serveBtn.disabled=false;serveBtn.classList.add('ready');
      brewBtn.querySelector('.fill').style.width='0%';toast('✨ Ready — GIVE it over!')}}
  fishStep(dt,NOW);

  /* bubble anchor */
  if(bubbleTarget&&!selOrder){const c=bubbleTarget;const s=toScreen(c.x,c.y-135);
    bubbleEl.style.display='block';
    bubbleEl.style.left=s.x+'px';bubbleEl.style.top=s.y+'px';
    document.getElementById('bwho').textContent=c.ail.who;
    document.getElementById('bail').textContent=c.ail.ail;
    const r=document.getElementById('pring');
    r.setAttribute('stroke-dashoffset',63*(1-c.patience));
    r.setAttribute('stroke',c.patience<.3?'#e04848':c.patience<.6?'#e8a33d':'#2cc4a8');
  }else bubbleEl.style.display='none';

  requestAnimationFrame(frame);
}
spawnVisitor();
requestAnimationFrame(frame);
</script></body></html>
